services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanthu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vanthu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanthu -d vanthu"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 1g
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Shared with worker: web writes uploaded PDFs to /data/pdf, worker reads them (DATA_DIR=/data).
      - appdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 1g
    networks: [internal]

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    # Phải lớn hơn SHUTDOWN_TIMEOUT_MS (30s) trong src/worker/config.ts.
    stop_grace_period: 45s
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/data
    healthcheck:
      # Process is alive (the check runs inside the container) and the DB answers `select 1`.
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    cpus: 1.0
    mem_limit: 1g
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    cpus: 0.5
    mem_limit: 256m
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
