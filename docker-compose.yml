# DATABASE_URL của web/worker/migrate được ghép từ POSTGRES_PASSWORD (phải URL-safe: openssl rand -hex 24).
# Biến lấy từ .env cùng thư mục (xem .env.example). Mỗi service chỉ nhận đúng biến nó cần.
# Nối mạng Dify: thêm `-f docker-compose.dify.yml` (xem docs/deploy.md mục 5).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanthu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vanthu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanthu -d vanthu"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 1g
    networks: [internal]

  # Một lần mỗi lần `up`: áp dụng migration SQL rồi seed (Ban thư ký + admin đầu tiên). Idempotent.
  # web và worker chỉ chạy khi service này thoát với mã 0.
  migrate:
    build: .
    image: vanthu-portal:local
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://vanthu:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vanthu
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m
    networks: [internal]

  web:
    build: .
    image: vanthu-portal:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vanthu:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vanthu
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:8080}
      DATA_DIR: ${DATA_DIR:-/data}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Shared with worker: web writes uploaded PDFs to /data/pdf, worker reads them (DATA_DIR=/data).
      - appdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 1.0
    mem_limit: 1g
    networks: [internal]

  worker:
    build: .
    image: vanthu-portal:local
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    # Phải lớn hơn SHUTDOWN_TIMEOUT_MS (30s) trong src/worker/config.ts.
    stop_grace_period: 45s
    environment:
      DATABASE_URL: postgres://vanthu:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vanthu
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      DATA_DIR: ${DATA_DIR:-/data}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - appdata:/data
    healthcheck:
      # Process is alive (the check runs inside the container) and the DB answers `select 1`.
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    cpus: 1.0
    mem_limit: 1g
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    cpus: 0.5
    mem_limit: 256m
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
